{{=<% %>=}}
name: Build & Deploy Docs (Multi-Version)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # Site directory, relative to the repository root
  DOCS_DIR: <%& docs_dir %>
  # For private repos: leave empty
  # For public repos: set to "/${{ github.event.repository.name }}"
  BASE_PREFIX: ""

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build all versions
        run: |
          # Get the latest versions.ts from main; it lists the versions to build
          git fetch origin main --depth=1
          LATEST_VERSIONS=$(git show "origin/main:$DOCS_DIR/src/data/versions.ts")
          LATEST_SELECT=$(git show "origin/main:$DOCS_DIR/src/components/VersionSelect.astro" 2>/dev/null || true)
          VERSIONS=$(echo "$LATEST_VERSIONS" | sed -n 's/^ *tag: "\(.*\)",$/\1/p')
          DEFAULT_VERSION=$(echo "$LATEST_VERSIONS" | awk -F'"' '/tag: "/ { tag = $2 } /default: true/ { print tag; exit }')
          DEFAULT_VERSION=${DEFAULT_VERSION:-$(echo "$VERSIONS" | head -n1)}
          echo "Found versions: $VERSIONS"

          # Create site directory structure
          SITE_DIR="$RUNNER_TEMP/site"
          mkdir -p "$SITE_DIR/versions"
          BUILT_COUNT=0

          # Build each version from its v-prefixed tag
          for version in $VERSIONS; do
            tag="v${version#v}"
            if ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::warning::Skipping version $version (tag $tag not found)"
              continue
            fi
            echo "Building version $version from $tag..."

            # Reset and checkout the tag
            git checkout .
            git checkout "$tag"

            # Clean this version's directory
            rm -rf "$SITE_DIR/versions/$version"

            # Install dependencies
            (cd "$DOCS_DIR" && bun install)

            # Replace versions.ts and VersionSelect.astro with latest from main
            if [ -f "$DOCS_DIR/src/data/versions.ts" ]; then
              echo "$LATEST_VERSIONS" > "$DOCS_DIR/src/data/versions.ts"
            fi
            if [ -n "$LATEST_SELECT" ]; then
              echo "$LATEST_SELECT" > "$DOCS_DIR/src/components/VersionSelect.astro"
            fi

            # Build this version
            (cd "$DOCS_DIR" && ASTRO_BASE="${BASE_PREFIX}/versions/$version/" bun run build)

            # Copy to site tree
            mkdir -p "$SITE_DIR/versions/$version"
            cp -a "$DOCS_DIR/dist/." "$SITE_DIR/versions/$version/"
            BUILT_COUNT=$((BUILT_COUNT + 1))

            echo "Completed build for $version"
          done

          # Fail before publishing if there is no usable default destination.
          if [ "$BUILT_COUNT" -eq 0 ]; then
            echo "::error::No documentation versions were built"
            exit 1
          fi
          if [ ! -d "$SITE_DIR/versions/$DEFAULT_VERSION" ]; then
            echo "::error::Default version $DEFAULT_VERSION was not built"
            exit 1
          fi

          # Create redirect to the default version
          cat > "$SITE_DIR/index.html" <<EOF
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=${BASE_PREFIX}/versions/$DEFAULT_VERSION/">
          <title>Redirecting…</title>
          <p>Redirecting to documentation $DEFAULT_VERSION…</p>
          EOF

          # Add .nojekyll file for GitHub Pages
          touch "$SITE_DIR/.nojekyll"

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ runner.temp }}/site
          keep_files: true
